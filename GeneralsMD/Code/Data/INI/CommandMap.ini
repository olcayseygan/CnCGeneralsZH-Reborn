;------------------------------------------------------------------------------

; cycle the dozers and workers that have nothing to do
CommandMap SELECT_NEXT_IDLE_WORKER
  Key = KEY_I
  Transition = DOWN
  Modifiers = NONE
  UseableIn = GAME
  Category = SELECTION
  Description = GUI:SelectNextIdleWorkerDescription
  DisplayName = GUI:SelectNextIdleWorker
End

; attack move.  'F' arms the mode, the next order click issues it (CommandXlat
; clears the mode again right after, so it is single shot).  It sits next to the
; attack key below, and the two turn each other off.
CommandMap TOGGLE_ATTACKMOVE
  Key = KEY_F
  Transition = DOWN
  Modifiers = NONE
  UseableIn = GAME
  Category = CONTROL
  Description = GUI:ToggleAttackMoveDescription
  DisplayName = GUI:ToggleAttackMove
End

; attack.  'A' arms force fire the same way, so a click on the ground, on rubble
; or on your own tank is an attack rather than a move.  Ctrl held still does it.
CommandMap TOGGLE_FORCEATTACK
  Key = KEY_A
  Transition = DOWN
  Modifiers = NONE
  UseableIn = GAME
  Category = CONTROL
  Description = GUI:ToggleForceAttackDescription
  DisplayName = GUI:ToggleForceAttack
End

; the order queue.  Retail put it on ALT; here it is SHIFT, the key every other RTS
; queues with, and the same key that adds to the selection - the two records both
; fire on the one modifier (MetaEvent.cpp), so a shift-click still adds a unit and
; a shift-right-click still queues an order.  Each queued point draws its own
; thread and marker, and they stay up after the key is let go.
CommandMap BEGIN_WAYPOINTS
  Key = KEY_NONE
  Transition = DOWN
  Modifiers = SHIFT
  UseableIn = GAME
End

CommandMap END_WAYPOINTS
  Key = KEY_NONE
  Transition = UP
  Modifiers = SHIFT
  UseableIn = GAME
End

; the general's promotion screen, on the key above tab
CommandMap TOGGLE_PURCHASE_SCIENCE
  Key = KEY_TICK
  Transition = DOWN
  Modifiers = NONE
  UseableIn = GAME
  Category = INTERFACE
  Description = GUI:TogglePurchaseScienceDescription
  DisplayName = GUI:TogglePurchaseScience
End

; stop what you are doing.  This file replaces the shipped command map rather than
; merging with it, so a retail key that is not written out here is simply not bound -
; which is what had happened to stop: the grid gives the command bar's stop button a
; cell letter, but the key every RTS player reaches for was dead.
CommandMap STOP
  Key = KEY_S
  Transition = DOWN
  Modifiers = NONE
  UseableIn = GAME
  Category = CONTROL
  Description = GUI:StopDescription
  DisplayName = GUI:Stop
End

