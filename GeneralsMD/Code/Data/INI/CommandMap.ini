;
; MASTER COPY - this is the tracked one.  The build copies it to
; Run/Data/INI/CommandMap.ini, which is where the game reads it from and which
; is gitignored, so edit THIS file and rebuild (or copy it across by hand).
;
; Loose overlay, loaded after Data\<Language>\CommandMap.ini, so a block here
; overrides that file entry-for-entry and new commands can be added.  Every
; binding this fork adds or moves lives here; KEYMAP.md is the readable
; version of the same table.
;
; Grid command bar, which is how the bar is driven - there is no other scheme and
; no switch: the command bar is 7 columns x 2 rows and the keys sit under the
; left hand in the same shape.
;
;   slot 01 03 05 07 09 11 13   (top row)      Q  W  E  R  T  Y  U
;   slot 02 04 06 08 10 12 14   (bottom row)   Z  X  C  V  B  N  M
;
; The bottom row is Z X C V B N M so that A (attack), S (stop) and F (attack
; move) stay free for the units.  The previous owners of the grid letters moved
; onto a modifier - see "displaced" below.

; column 1, top row
CommandMap COMMAND_SLOT01
  Key = KEY_Q
  Transition = DOWN
  Modifiers = NONE
  UseableIn = GAME
  Category = CONTROL
  Description = GUI:CommandSlot01Description
  DisplayName = GUI:CommandSlot01
End

